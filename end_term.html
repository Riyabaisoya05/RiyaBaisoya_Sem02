<!-- even and odd numbers checker create a web page using html internal cssand javascript
  -->
       <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even and Odd Number Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Even and Odd Number Checker</h2>
        <input type="number" id="numberInput" placeholder="Enter a number">
        <button onclick="checkEvenOdd()">Check</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        function checkEvenOdd() {
            const number = document.getElementById('numberInput').value;
            const resultDiv = document.getElementById('result');

            if (number === '') {
                resultDiv.textContent = 'Please enter a number.';
                return;
            }

            if (isNaN(number)) {
                resultDiv.textContent = 'Please enter a valid number.';
                return;
            }

            if (number % 2 === 0) {
                resultDiv.textContent = `${number} is an even number.`;
            } else {
                resultDiv.textContent = `${number} is an odd number.`;
            }
        }
    </script>
</body>
</html>
